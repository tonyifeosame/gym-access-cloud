openapi: 3.1.0

# ---------------------------------------------------------------------------
# AccessLink API — the public specification behind https://accesslink.store/docs.
#
# THIS FILE DESCRIBES WHAT IS SERVED, NOT WHAT IS PLANNED. Every path here is
# checked against the router by openapi_docs_test.go (a documented route that
# the server does not mount fails the build, and so does a mounted public route
# that is not documented here), and every error code is checked against
# models.APIErrors. Examples were captured from a running server; the cursors in them are
# opaque tokens from a development database and unlock nothing. The guide's
# tagged examples (```bash {op=…} / ```json {op=… status=…}) are checked against
# the schemas by scripts/validate-examples.mjs and replayed through the real
# router by openapi_docs_test.go.
#
# Two audiences share this document and are kept apart by tag group:
#   - the PUBLIC API (/api/public/v1), authenticated by an integration
#     credential, which is the contract for third parties; and
#   - a small, clearly marked slice of the CONSOLE API (operator session +
#     CSRF), included only because fingerprint enrolment is started there and
#     not through the public tree.
# Hardware (terminal and site-key) routes are deliberately absent.
# ---------------------------------------------------------------------------

info:
  title: AccessLink API
  version: "2026-09-15"
  summary: Fingerprint access control for your own systems — members, access rules, sites and events.
  contact:
    name: AccessLink
    url: https://accesslink.store
  description: |
    AccessLink runs fingerprint terminals at doors, gates and turnstiles. Staff manage
    people, terminals, sites and access rules in the **AccessLink Console**; this API is
    how your own software — a membership platform, a booking system, an HR tool, a
    reporting job — takes part without a person at the console.

    Base URL `https://api.accesslink.store/api/public/v1` · JSON in and out · timestamps
    are RFC 3339 in UTC · the machine-readable specification is
    [`openapi.yaml`](/docs/openapi.yaml) (also as [JSON](/docs/openapi.json)).

    ## Quick start

    1. **Get an API key.** In the console, an Administrator or Owner opens
       **Settings → API access → Issue credential**, picks the scopes the integration
       needs (and, optionally, the sites it may see) and copies the key. It is shown
       once; store it in your secret manager. Keys expire after a year unless you
       choose otherwise, and can be rotated with a 72-hour overlap.

    2. **Make a request.**

       ```bash {op=listMembers}
       curl "https://api.accesslink.store/api/public/v1/members?limit=2" \
         -H "Authorization: Bearer <ACCESSLINK_API_KEY>"
       ```

    3. **Read the response.** Lists come back as `data` plus `has_more` and
       `next_cursor`; single records come back as the object itself.

       ```json {op=listMembers status=200}
       {
         "data": [
           {
             "id": "94ed94c2-6984-40eb-a19b-7dc752caaa9e",
             "member_id": "MEM003",
             "full_name": "Alan Turing",
             "membership_type": "ANNUAL",
             "active": true,
             "created_at": "2026-09-11T10:35:00.389158Z",
             "updated_at": "2026-09-11T10:35:00.389158Z"
           },
           {
             "id": "30aa0802-c537-4fad-a647-7035d0c5a398",
             "member_id": "MEM002",
             "full_name": "Grace Hopper",
             "membership_type": "MONTHLY",
             "active": true,
             "created_at": "2026-09-11T10:35:00.347723Z",
             "updated_at": "2026-09-11T10:35:00.347723Z"
           }
         ],
         "has_more": true,
         "next_cursor": "AkwiRQG6XwT_h0mx7hNHjFINCEMZ8SszybWW7dDh0ZFrJLn0-v7op9IzDmBk3OXLpfxjtfMg8mUAJ_SawP211X5E-odV1sKaKWmn4z23nOEAmv1YpfVvPWYFRCSTaZLu7FBVd8PJPFVJxYcU8lFJbYDcu6fY"
       }
       ```

    Every response carries an `X-Request-ID` header; quote it when you contact
    support. What the API does **not** do: unlock a door, command a terminal, enrol or
    read a fingerprint, or list terminals — see *Fingerprint authentication* below.

    ## Authentication

    Send the key on every request:

    ```
    Authorization: Bearer <ACCESSLINK_API_KEY>
    ```

    Keys look like `atp_live_…`. **Your company is determined by the key** — no
    request names a company, and one that tries (`company_id` anywhere) is refused
    with `400 tenant_identity_not_permitted`. A missing or unaccepted key is `401`
    with `WWW-Authenticate: Bearer realm="accesslink"`:

    ```json {op=listMembers status=401}
    {
      "error": {
        "type": "authentication_error",
        "code": "api_credential_missing",
        "message": "No credential was presented. Send Authorization: Bearer <your key>.",
        "request_id": "6e4a99b280eb9e6e",
        "doc_url": "https://accesslink.store/docs/errors/api_credential_missing"
      }
    }
    ```

    **Scopes.** A key carries the scopes chosen when it was issued; each route names
    the one it needs, and a key without it is refused `403 insufficient_scope` before
    anything is looked up.

    | Scope | Unlocks |
    |---|---|
    | `members:read` | reading members |
    | `members:write` | creating, updating and removing members (includes `members:read`) |
    | `access:read` | a member's access rules |
    | `sites:read` | reading sites |
    | `sites:write` | creating sites and changing their details (includes `sites:read`) |
    | `events:read` | the events trail |

    **Site restriction.** A key issued for a named set of sites lists, reads and
    changes only those sites and only events at them; a site outside the set is
    `403 site_not_permitted`. It **cannot create** a site either: creating is a
    company-wide act, and a key that could create a site it would then be unable
    to read or change is a capability nobody chose. Members are company-wide and
    are not narrowed.

    ## Connecting an application

    The section above is for software a customer's own staff configure. If you are
    building a product that *other people's* AccessLink accounts connect to, do not
    ask them to paste a key: use **Connect**, and they authorise you in two clicks.

    It is OAuth 2.0, authorization code with PKCE. You register once with
    AccessLink and are given a `client_id`, an optional secret, and one or more
    exact callback addresses. Nothing about the flow requires the customer to visit
    the AccessLink console — they see an AccessLink sign-in page and a consent page,
    and come straight back to you.

    **1. Send the customer to AccessLink.** Generate a `code_verifier` (43–128
    characters from `A–Z a–z 0–9 - . _ ~`), keep it, and send its base64url
    SHA-256 digest as the `code_challenge`:

    ```
    https://api.accesslink.store/api/public/v1/oauth/authorize
      ?response_type=code
      &client_id=datavase
      &redirect_uri=https%3A%2F%2Fapp.datavase.example%2Fintegrations%2Faccesslink%2Fcallback
      &scope=sites%3Aread%20sites%3Awrite
      &state=dG9rZW4tYmluZGluZy1zdGF0ZQ
      &code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
      &code_challenge_method=S256
    ```

    The `redirect_uri` is compared **exactly** against what you registered. If it
    does not match, or the `client_id` is unknown, the customer sees an AccessLink
    page and is returned nowhere — we will not redirect to an address we cannot
    vouch for.

    **2. Read the callback.** We return them to your address with `code` and your
    `state`. Check the `state` matches the one you sent. A customer who declines
    comes back as `?error=access_denied&state=…` instead.

    ```
    https://app.datavase.example/integrations/accesslink/callback
      ?code=atc_9f2c…&state=dG9rZW4tYmluZGluZy1zdGF0ZQ
    ```

    **3. Exchange the code**, from your server, within two minutes. A code works
    once:

    ```bash
    curl -X POST "https://api.accesslink.store/api/public/v1/oauth/token" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -u "datavase:<YOUR_CLIENT_SECRET>" \
      --data-urlencode "grant_type=authorization_code" \
      --data-urlencode "code=<CODE_FROM_CALLBACK>" \
      --data-urlencode "redirect_uri=https://app.datavase.example/integrations/accesslink/callback" \
      --data-urlencode "code_verifier=<YOUR_CODE_VERIFIER>"
    ```

    ```json
    {
      "access_token": "ato_live_…",
      "token_type": "Bearer",
      "expires_in": 3600,
      "refresh_token": "atr_live_…",
      "scope": "sites:read sites:write"
    }
    ```

    **4. Call the API** with the access token, exactly as you would with a key.
    Every route in this reference accepts either and cannot tell them apart:

    ```
    Authorization: Bearer ato_live_…
    ```

    **5. Refresh before it expires.** An access token lasts an hour.

    ```bash
    curl -X POST "https://api.accesslink.store/api/public/v1/oauth/token" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -u "datavase:<YOUR_CLIENT_SECRET>" \
      --data-urlencode "grant_type=refresh_token" \
      --data-urlencode "refresh_token=<YOUR_REFRESH_TOKEN>"
    ```

    > **Refresh tokens rotate, and reuse is fatal to the connection.** Every
    > refresh returns a *new* refresh token and retires the one you sent. Store the
    > new one before you use it, and never retry a refresh with the old token after
    > a timeout — if a retired token is presented, two parties hold tokens for one
    > connection and AccessLink cannot tell which is which, so it revokes the
    > connection and the customer has to reconnect. If a refresh times out, refresh
    > again with the newest token you have; if that fails with `invalid_grant`,
    > send the customer through Connect again.

    **6. Disconnecting.** Send the refresh token to end the whole connection.
    The endpoint answers `200` whether or not it recognised the token.

    ```bash
    curl -X POST "https://api.accesslink.store/api/public/v1/oauth/revoke" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -u "datavase:<YOUR_CLIENT_SECRET>" \
      --data-urlencode "token=<YOUR_REFRESH_TOKEN>"
    ```

    **What a connection can carry in this version: `sites:read` and
    `sites:write`.** Other scopes exist for API keys and are not offered through
    a consent screen yet.

    **What a customer can grant you.** Only what they hold themselves. The consent
    screen offers the intersection of what you asked for, what your client is
    registered for, and what the signed-in operator's own role allows —
    `sites:write` needs an Administrator or the account Owner. If their account
    cannot grant it, they are told to ask somebody who can, and you are told only
    that the request was declined. A grant is also narrowed to the sites that
    operator can reach, and narrows further by itself if their access is later
    reduced.

    **Errors here look different.** The four Connect endpoints answer in OAuth's
    own shape — a plain `error` string — because that is what client libraries
    parse. Every other route in this reference answers with the `error` object
    described under *Errors*.

    ```json
    {
      "error": "invalid_grant",
      "error_description": "That authorization code is not valid."
    }
    ```

    ## Integration flow

    The three calls most integrations make, with the exact requests and responses.

    **1. Create a member** when someone joins. `member_id` is *your* identifier —
    the number the terminal reads and reports back in events — so use the one your
    system already has (up to 31 printable ASCII characters, no spaces). Send an
    `Idempotency-Key` so a retry can never create a duplicate.

    ```bash {op=createMember}
    curl -X POST "https://api.accesslink.store/api/public/v1/members" \
      -H "Authorization: Bearer <ACCESSLINK_API_KEY>" \
      -H "Content-Type: application/json" \
      -H "Idempotency-Key: <UNIQUE_REQUEST_ID>" \
      -d '{"member_id":"MEM042","full_name":"Ada Lovelace","membership_type":"ANNUAL"}'
    ```

    ```json {op=createMember status=201}
    {
      "id": "0cae6469-6671-4611-9ca4-012a199c0fc8",
      "member_id": "MEM042",
      "full_name": "Ada Lovelace",
      "membership_type": "ANNUAL",
      "active": true,
      "created_at": "2026-09-11T19:20:46.204475Z",
      "updated_at": "2026-09-11T19:20:46.204475Z"
    }
    ```

    The same request again with the same `Idempotency-Key` returns this same `201`
    with `Idempotent-Replay: true`. Without the key, a second attempt is a conflict:

    ```json {op=createMember status=409}
    {
      "error": {
        "type": "conflict_error",
        "code": "member_id_already_exists",
        "message": "A member with that id already exists.",
        "param": "member_id",
        "request_id": "ed315d247eb6e49a",
        "doc_url": "https://accesslink.store/docs/errors/member_id_already_exists"
      }
    }
    ```

    **2. Check what access they have.** A new member carries the company's default
    rule. Each rule says where it applies, whether it lets in or keeps out, and
    whether it is in force right now.

    ```bash {op=getMemberAccess}
    curl "https://api.accesslink.store/api/public/v1/members/MEM042/access" \
      -H "Authorization: Bearer <ACCESSLINK_API_KEY>"
    ```

    ```json {op=getMemberAccess status=200}
    {
      "member_id": "MEM042",
      "active": true,
      "rules": [
        {
          "id": "a30363e0-f216-4b47-83f9-b45bd74ef19f",
          "scope": "COMPANY",
          "effect": "ALLOW",
          "standing": "IN_FORCE"
        }
      ]
    }
    ```

    **3. Read what happened at the doors.** Events are newest first; filter by
    member, site, outcome or time window, and page with `next_cursor`.

    ```bash {op=listEvents}
    curl "https://api.accesslink.store/api/public/v1/events?member_id=MEM042&limit=2" \
      -H "Authorization: Bearer <ACCESSLINK_API_KEY>"
    ```

    ```json {op=listEvents status=200}
    {
      "data": [
        {
          "id": "b86cbd42-0a1c-40cc-b641-1e01ff7fc58a",
          "event_type": "ACCESS_DENIED",
          "decision": "DENIED",
          "reason": "OUTSIDE_SCHEDULE",
          "member_id": "MEM042",
          "member": "0cae6469-6671-4611-9ca4-012a199c0fc8",
          "subject": "MEM042",
          "site_id": "46e57753-0143-481a-83f6-e93a36cfb9a7",
          "terminal_serial": "AT-E05A1B38AA38",
          "occurred_at": "2026-09-11T12:14:00Z",
          "occurred_at_trusted": true,
          "recorded_at": "2026-09-11T19:20:46.187594Z"
        }
      ],
      "has_more": false,
      "next_cursor": null
    }
    ```

    To stop someone getting in, `PATCH` the member with `{"active": false}`
    (reversible; they are refused with reason `PERSON_INACTIVE`). To remove them for
    good, `DELETE` the member — they leave every terminal and would have to be
    enrolled again.

    ## Core operations

    | | Method and path | Scope |
    |---|---|---|
    | Members | `GET /members` · `POST /members` · `GET`/`PATCH`/`DELETE /members/{member_id}` | `members:read` / `members:write` |
    | Access | `GET /members/{member_id}/access` | `access:read` |
    | Sites | `GET /sites` · `GET`/`PATCH /sites/{site_id}` · `POST /sites` | `sites:read` / `sites:write` |
    | Events | `GET /events` | `events:read` |

    Paths are relative to `https://api.accesslink.store/api/public/v1`. Each is
    documented in full in the reference below, with its parameters, schemas and
    every error it can return.

    **Creating a site.** `name`, `country` (ISO 3166-1 alpha-2) and `timezone`
    (an IANA zone name — an offset like `+01:00` is not a zone) are all required.
    The timezone is where the hardware stands, and it is what access schedules at
    that site are evaluated in, so there is no sensible default to fall back on.

    ```bash {op=createSite}
    curl -X POST "https://api.accesslink.store/api/public/v1/sites" \
      -H "Authorization: Bearer <ACCESSLINK_API_KEY>" \
      -H "Content-Type: application/json" \
      -d '{"name":"Abuja Studio","address":"3 Shehu Shagari Way","country":"NG","timezone":"Africa/Lagos"}'
    ```

    ```json {op=createSite status=201}
    {
      "id": "3e2550b2-d1cd-4d0a-915d-dd79c68120e5",
      "name": "Abuja Studio",
      "address": "3 Shehu Shagari Way",
      "country": "NG",
      "timezone": "Africa/Lagos",
      "active": true,
      "terminal_count": 0,
      "created_at": "2026-09-22T10:34:35.327588Z"
    }
    ```

    A second create with the same name is `409 site_name_already_exists` rather
    than a second location, **so a retry after a timeout is safe and is the right
    move**: `201` means the first attempt had not landed, `409` means it had, and
    `GET /sites` then gives you the site — names are unique among a company's live
    sites. `Idempotency-Key` is not needed on this route and is not honoured on a
    request authenticated with an access token. Changing a site is
    `PATCH /sites/{site_id}` with only the fields you are changing; `active: false`
    stops that site's terminals authenticating and is reversible. There is no
    delete — retiring a site also retires every terminal at it, which is a decision
    for a person in the console.

    ## Fingerprint authentication

    - **The terminal recognises the finger.** A person presents a finger at a
      terminal; the terminal matches it against the fingerprints it holds, applies
      the access rules it has synchronised, and admits or refuses. The outcome
      reaches you as an event.
    - **Enrolment is done by staff, at a terminal.** A console operator chooses the
      terminal the person is standing at, and it captures their fingerprint. There
      is no public route that starts an enrolment or reads a fingerprint; your
      integration creates the member, staff enrol them. (Console-authenticated
      tooling can start an enrolment — see *Fingerprint enrolment* in the reference.)
    - **The fingerprint stays on the terminal that captured it.** No route returns
      biometric data, and member objects have no field for it — sending
      `fingerprint_template` is refused as `400 unknown_field`.
    - **New members reach terminals on their next sync**, so allow a short delay
      before a newly created or deactivated member is recognised or refused.
    - **There is no "would this person be admitted?" call.** The decision is made at
      a terminal, at a moment. Read the rules (`/members/{member_id}/access`, each
      with its `standing`) beforehand, and the outcome (`/events`) afterwards.

    ## Errors

    Every error is one object under `error`. **Branch on `code` and the HTTP status,
    never on `message`**; codes are additive only — never renamed, removed or given
    a different meaning. `param` names the offending field or parameter when there
    is one; `request_id` matches the `X-Request-ID` header; `doc_url` points at that
    code's page on this site.

    | Status | `type` | Codes |
    |---|---|---|
    | `400` | `invalid_request_error` | `unknown_parameter`, `unknown_field`, `missing_field`, `invalid_field`, `invalid_timestamp`, `cursor_invalid`, `sort_not_supported`, `tenant_identity_not_permitted`, `member_id_unusable`, `idempotency_key_invalid`, `body_too_large` |
    | `401` | `authentication_error` | `api_credential_missing`, `api_credential_invalid`, `api_credential_wrong_environment` |
    | `403` | `permission_error` | `insufficient_scope`, `site_not_permitted` |
    | `404` | `not_found_error` | `resource_not_found` — the same answer for a record that never existed and one outside your company |
    | `409` | `conflict_error` | `member_id_already_exists`, `roster_exceeds_terminal_capacity`, `idempotency_key_reuse`, `idempotency_in_progress` |
    | `410` | `gone_error` | `cursor_expired` |
    | `429` | `rate_limit_error` | `rate_limit_exceeded` (with `Retry-After`) |
    | `500` / `503` | `api_error` | `internal_error` / `service_unavailable` (`503` carries `Retry-After`) |

    Unknown input is refused, not ignored: an undefined body field is
    `400 unknown_field`, an undefined query parameter is `400 unknown_parameter`.
    Every code has a page at `https://accesslink.store/docs/errors/<code>`.

    ## Rate limits

    | Allowance | Applies to | Burst | Sustained |
    |---|---|---|---|
    | per key | each API key | 60 | 300 per minute |
    | per company | all of a company's keys together | 200 | 900 per minute |
    | failed authentication | per client address | 30 | 60 per minute |

    Every authenticated response carries your key's allowance — pace against these,
    not the numbers above, which may change with notice:

    | Header | Meaning |
    |---|---|
    | `RateLimit-Limit` | burst ceiling |
    | `RateLimit-Remaining` | requests left right now |
    | `RateLimit-Reset` | seconds until the allowance is full again |
    | `RateLimit-Policy` | the sustained allowance, e.g. `300;w=60` |

    A refusal is `429 rate_limit_exceeded` with `Retry-After` (whole seconds).
    Every request counts, whatever its status; failed authentication counts only
    against the per-address allowance, never against your key.

    ## Full API reference

    The sections that follow document each route: parameters, request and response
    schemas, and every error with an example. **Public API** is the tree above.
    **Console API (operator session)** is a small, separately authenticated slice of
    the AccessLink Console's own API — included because fingerprint enrolment is
    started there — and carries a weaker compatibility promise.

    ### Reference notes

    <details>
    <summary><strong>Pagination</strong> — cursors, limits, ordering</summary>

    `limit` is `1`–`200` (default `50`); anything else is `400 invalid_field`.
    `cursor` is the previous page's `next_cursor`, verbatim; it is opaque — do not
    decode, build or compare cursors. `data` is `[]` when empty, never `null`;
    `next_cursor` is `null` on the last page. Ordering is newest first, so paging
    visits every record exactly once. A cursor is bound to your key and to the
    query that produced it: presented with different filters or altered it is
    `400 cursor_invalid`. Members and events are kept indefinitely in this version,
    so their cursors do not expire (`410 cursor_expired` is reserved for when they
    do).

    </details>

    <details>
    <summary><strong>Idempotency</strong> — safe retries on writes</summary>

    Any write may carry an `Idempotency-Key` header (1–255 characters, unique per
    key). A repeat of the **same** request under the same key within 24 hours is
    answered with the stored response — same status, same body, plus
    `Idempotent-Replay: true` — and the write does not run again. The same key with
    a different method, path or body is `409 idempotency_key_reuse`; a repeat while
    the first attempt is still running is `409 idempotency_in_progress`. A `400` or
    `409` is stored and replayed too, so a corrected request needs a new key; only a
    `5xx` releases the key. Recommended on `POST`; `PATCH` and `DELETE` are safe to
    repeat without one.

    </details>

    <details>
    <summary><strong>Changelog</strong></summary>

    - **2026-09-15** — First publication: public API v1 (members, access rules,
      sites, events) and the console enrolment slice; error-code pages live at
      `/docs/errors/<code>`.

    </details>

servers:
  - url: https://api.accesslink.store
    description: Production

x-tagGroups:
  - name: Public API
    tags: [Connect, Members, Access, Sites, Events]
  - name: Console API (operator session)
    tags: [Console session, Fingerprint enrolment]

tags:
  - name: Connect
    description: |
      How an application is connected to a customer's AccessLink account without
      anybody copying a key. The customer is sent to AccessLink, signs in, sees
      exactly what is being asked for and allows it; the application receives an
      access token and a refresh token. **OAuth 2.0 authorization code with PKCE
      (S256).** These four endpoints are the only ones that are reached without a
      credential, and the only ones that answer in the OAuth error shape
      (`{"error": "invalid_grant", …}`) rather than this API's.

      **In this version a connection can carry `sites:read` and `sites:write`
      only.** Other scopes exist for API keys and are not offered through a
      consent screen yet.
  - name: Members
    description: |
      The people your terminals recognise. **Scope `members:read`, or
      `members:write` for changes.** A member is exactly the seven fields shown —
      no biometric field of any kind.

      `member_id` is your own identifier (the number a terminal reads): up to 31
      printable ASCII characters, no spaces, unique per company, stored exactly
      as supplied. Members are company-wide; a key's site restriction does not
      narrow them. Every write is recorded in your company's audit trail.
  - name: Access
    description: |
      A member's access rules and whether each is in force now. **Scope
      `access:read`.** Rules, not a verdict: admission is decided at a terminal
      at the moment of presentation — read the outcome in *Events*.
  - name: Sites
    description: |
      Your sites — where terminals stand. **Scope `sites:read`, or `sites:write`
      to create and change them.** A key issued for particular sites reads and
      changes only those, and **cannot create new ones** — creating is a
      company-wide act, and a key scoped away from company-wide reach does not
      have it.

      A site has a `name`, a `country` (ISO 3166-1 alpha-2) and a `timezone`
      (IANA zone name). The timezone is where the *hardware* stands and is what
      access schedules at that site are evaluated in, so it is required on
      create rather than defaulted. There is no delete: retiring a site also
      retires every terminal at it and stops those doors opening by fingerprint,
      which is a decision for a person in the console.
  - name: Events
    description: |
      Every presentation at a door — admitted or refused, and why. **Scope
      `events:read`.** Newest first, filterable, paginated by cursor.
  - name: Console session
    description: |
      Signing an operator in and out of the AccessLink Console API. **These are
      the console's own endpoints**, documented because the enrolment routes
      below need them. They use a session cookie (`__Host-al_session`, set by
      *Sign in*), the `X-CSRF-Token` header (the `csrf_token` from the session
      body) on every request that is not `GET`, and the console's error shape
      `{"error": "…"}`. They are not covered by the public API's compatibility
      promise. Use an operator account created for your tooling, with the lowest
      role that can do the job; repeated sign-in failures lock the account for a
      period.
  - name: Fingerprint enrolment
    description: |
      Ask one terminal to capture a person's fingerprint, and follow what became
      of it. **Operator session + CSRF; Manager or above with access to the
      terminal's site.** The person must be standing at the terminal, which
      enters enrolment mode for a bounded window (default 5 minutes). The
      fingerprint is stored on that terminal; no route returns it. States:
      `PENDING` → `IN_PROGRESS` → `COMPLETED`, or `FAILED` (the terminal's own
      words in `error_message`), `EXPIRED` (nobody presented a finger in time),
      `CANCELLED`.

components:
  securitySchemes:
    IntegrationCredential:
      type: http
      scheme: bearer
      bearerFormat: atp_live_…
      description: |
        An API key issued in the console under *Settings → API access*. Send it
        as `Authorization: Bearer <ACCESSLINK_API_KEY>`. The scope each route
        needs is listed on the operation.
    DatavaseOAuth:
      type: oauth2
      description: |
        An access token obtained through *Connect* — OAuth 2.0 authorization
        code with PKCE. Send it exactly as an API key, `Authorization: Bearer
        <token>`; tokens look like `ato_live_…`, last an hour, and are refreshed
        with a rotating refresh token. Every route below accepts either an API
        key or an access token and cannot tell them apart: the scopes a token
        carries are the same scopes, and the account is determined by the grant.
      flows:
        authorizationCode:
          authorizationUrl: https://api.accesslink.store/api/public/v1/oauth/authorize
          tokenUrl: https://api.accesslink.store/api/public/v1/oauth/token
          refreshUrl: https://api.accesslink.store/api/public/v1/oauth/token
          scopes:
            sites:read: Read the account's sites.
            sites:write: Create sites and change their details.
    OperatorSession:
      type: apiKey
      in: cookie
      name: __Host-al_session
      description: |
        The operator session cookie set by `POST /api/v1/auth/login`
        (HttpOnly, Secure, SameSite=Lax). Console requests that are not `GET`
        must also carry the `X-CSRF-Token` header with the `csrf_token` from
        the session body.

  parameters:
    limit:
      name: limit
      in: query
      required: false
      description: Page size, `1`–`200`. Default `50`. Out of bounds or not an integer is `400 invalid_field`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 2
    cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` from the previous page, verbatim. Opaque — do not decode, construct or compare.
      schema:
        type: string
    memberId:
      name: member_id
      in: path
      required: true
      description: The member's own identifier — the value a terminal reads.
      schema:
        type: string
        maxLength: 31
      example: MEM001
    siteId:
      name: site_id
      in: path
      required: true
      description: The site's public identifier (UUID).
      schema:
        type: string
        format: uuid
      example: 46e57753-0143-481a-83f6-e93a36cfb9a7
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional, 1–255 characters, unique per credential. A repeat of the same
        request under the same key within 24 hours is answered with the stored
        response and `Idempotent-Replay: true`. See *Idempotency*.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 0f3f1c0e-issue-1
    externalId:
      name: external_id
      in: path
      required: true
      description: The person's identifier — the same value the public API calls `member_id`.
      schema:
        type: string
        maxLength: 31
      example: MEM001
    serial:
      name: serial
      in: path
      required: true
      description: The terminal's serial number, as printed on the unit and shown in the console.
      schema:
        type: string
      example: AT-E05A1B38AA38

  headers:
    X-Request-ID:
      description: Correlation id for this request; the same value appears as `request_id` in an error body. Quote it to support.
      schema:
        type: string
      example: 7bd8490b23dbdbcc
    RateLimit-Limit:
      description: The credential bucket's burst ceiling.
      schema: { type: integer }
      example: 60
    RateLimit-Remaining:
      description: Whole tokens left in the credential bucket after this request.
      schema: { type: integer }
      example: 59
    RateLimit-Reset:
      description: Seconds until the credential bucket is full again.
      schema: { type: integer }
      example: 12
    RateLimit-Policy:
      description: The sustained allowance, as `<requests>;w=<seconds>`.
      schema: { type: string }
      example: 300;w=60
    Retry-After:
      description: Whole seconds to wait before retrying; never less than 1.
      schema: { type: integer }
      example: 1
    WWW-Authenticate:
      description: Always `Bearer realm="accesslink"` on a `401`.
      schema: { type: string }
      example: Bearer realm="accesslink"
    Idempotent-Replay:
      description: Present, as `true`, when the response is the stored answer to an earlier request with the same `Idempotency-Key`.
      schema: { type: string }
      example: "true"

  schemas:
    Error:
      type: object
      description: The one error shape every public-API error uses. Branch on `code` and status, never on `message`.
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              description: Coarse class of the failure.
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - conflict_error
                - gone_error
                - rate_limit_error
                - api_error
            code:
              type: string
              description: The stable identifier. Additive only — never renamed, removed or given a different meaning.
              example: resource_not_found
            message:
              type: string
              description: For a person to read. Not stable; do not parse.
            param:
              type: string
              description: The body field or query parameter at fault, when there is one.
            request_id:
              type: string
              description: The same value as the `X-Request-ID` response header.
            doc_url:
              type: string
              format: uri
              description: The page for this code at https://accesslink.store/docs/errors/<code>.
      example:
        error:
          type: not_found_error
          code: resource_not_found
          message: No such resource.
          request_id: 5cf64ccbac9a0b34
          doc_url: https://accesslink.store/docs/errors/resource_not_found

    Member:
      type: object
      description: A person the terminals recognise. These seven fields are the whole object.
      required: [id, member_id, full_name, membership_type, active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: The member's public identifier.
        member_id:
          type: string
          maxLength: 31
          description: The identifier a terminal reads — your own badge or member number. Unique per company; the path parameter.
        full_name:
          type: string
          maxLength: 200
        membership_type:
          type: string
          maxLength: 50
          description: Free text; shown as *Category* in the console.
        active:
          type: boolean
          description: An inactive member is refused at every terminal with reason `PERSON_INACTIVE`, whatever their rules say.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: ac8f7af9-9fb2-4bcf-97f8-a9ff2f5e0070
        member_id: MEM001
        full_name: Ada Lovelace
        membership_type: ANNUAL
        active: true
        created_at: "2026-09-11T10:35:00.289175Z"
        updated_at: "2026-09-11T10:35:00.289175Z"

    MemberCreate:
      type: object
      description: The body of `POST /members`. A field this version does not define — including `fingerprint_template` — is `400 unknown_field`.
      additionalProperties: false
      required: [member_id, full_name]
      properties:
        member_id:
          type: string
          maxLength: 31
          description: At most 31 printable ASCII characters, no spaces; unique per company. Stored as supplied.
        full_name:
          type: string
          maxLength: 200
        membership_type:
          type: string
          maxLength: 50
          default: STANDARD
        active:
          type: boolean
          default: true
      example:
        member_id: MEM042
        full_name: Ada Lovelace

    MemberUpdate:
      type: object
      description: |
        The body of `PATCH /members/{member_id}`. Partial: an absent field keeps
        its value. At least one field is required; an explicitly empty
        `full_name` or `membership_type` is `400 invalid_field`; `member_id` in
        the body is `400 invalid_field` because it cannot change.
      additionalProperties: false
      minProperties: 1
      properties:
        full_name:
          type: string
          maxLength: 200
        membership_type:
          type: string
          maxLength: 50
        active:
          type: boolean
      example:
        active: false

    MemberPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"
          description: This page; `[]` when empty, never `null`.
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
          description: The cursor for the next page; `null` when `has_more` is `false`.

    AccessRule:
      type: object
      required: [id, scope, effect, standing]
      properties:
        id:
          type: string
          format: uuid
          description: The rule's public identifier.
        scope:
          type: string
          enum: [COMPANY, SITE, TERMINAL]
          description: Where the rule applies.
        site_id:
          type: string
          format: uuid
          description: Present when `scope` is `SITE`.
        terminal_serial:
          type: string
          description: Present when `scope` is `TERMINAL`.
        effect:
          type: string
          enum: [ALLOW, DENY]
          description: A `DENY` always wins over an `ALLOW`.
        application:
          type: string
          description: Present when the rule is narrowed to one capability (for example `ACCESS_CONTROL`); absent means every capability.
        schedule_id:
          type: string
          format: uuid
          description: Present when the rule applies only inside a schedule's windows.
        starts_at:
          type: string
          format: date-time
          description: Start of the rule's validity window; absent means already started.
        ends_at:
          type: string
          format: date-time
          description: End of the rule's validity window; absent means no end.
        standing:
          type: string
          enum: [IN_FORCE, NOT_YET, EXPIRED, INACTIVE]
          description: As of the request — in force, not yet started, ended, or switched off.

    MemberAccess:
      type: object
      required: [member_id, active, rules]
      properties:
        member_id:
          type: string
        active:
          type: boolean
          description: The member's own flag. An inactive member is refused everywhere whatever the rules say.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AccessRule"
          description: Listed whatever the key's site restriction, because the rules describe the person rather than a site's data.
      example:
        member_id: MEM042
        active: true
        rules:
          - id: a30363e0-f216-4b47-83f9-b45bd74ef19f
            scope: COMPANY
            effect: ALLOW
            standing: IN_FORCE

    Site:
      type: object
      description: These eight fields are the whole object.
      required: [id, name, address, country, timezone, active, terminal_count, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The site's public identifier; the path parameter.
        name:
          type: string
        address:
          type: string
          description: Always present; `""` when the site has none.
        country:
          type: string
          description: |
            ISO 3166-1 alpha-2, upper case. Always present; `""` for a site
            created before the field existed, or created in the console, which
            does not ask for one.
          example: NG
        timezone:
          type: string
          description: IANA time zone name of where the hardware stands.
          example: Africa/Lagos
        active:
          type: boolean
          description: |
            `false` stops the site's terminals authenticating. Reversible, and
            not the same as retiring a site.
        terminal_count:
          type: integer
          description: Live (non-retired) terminals at the site.
        created_at:
          type: string
          format: date-time
      example:
        id: 46e57753-0143-481a-83f6-e93a36cfb9a7
        name: Lagos Depot
        address: 14 Marina Road
        country: NG
        timezone: Africa/Lagos
        active: true
        terminal_count: 0
        created_at: "2026-09-11T10:34:35.32243Z"

    SiteCreate:
      type: object
      description: |
        `name`, `country` and `timezone` are required. `active` is not accepted:
        a new site is always active, and sending the field is
        `400 invalid_field` rather than being ignored.
      required: [name, country, timezone]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: Unique among this account's live sites, case-insensitively.
        address:
          type: string
          description: Optional, free text.
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2. Case-insensitive on the way in, stored upper case.
        timezone:
          type: string
          description: IANA zone name. An offset such as `+01:00` is not a zone and is refused.
      example:
        name: Abuja Studio
        address: 3 Shehu Shagari Way
        country: NG
        timezone: Africa/Lagos

    SiteUpdate:
      type: object
      description: |
        Partial. Supply at least one field; anything absent keeps its value. An
        explicitly empty `name`, `country` or `timezone` is `400 invalid_field`,
        not a blanking.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
        timezone:
          type: string
        active:
          type: boolean
      example:
        timezone: Africa/Lagos
        active: false

    TokenResponse:
      type: object
      description: RFC 6749 section 5.1. The only response in this API that contains a credential.
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: "Send as `Authorization: Bearer <access_token>`."
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: |
            Present on both grant types. **It changes on every refresh** - store
            the new one and discard the old. Presenting a refresh token twice
            revokes the whole connection.
        scope:
          type: string
          description: The scopes actually granted, space-delimited. May be narrower than requested.
      example:
        access_token: ato_live_EXAMPLE_NOT_A_REAL_TOKEN
        token_type: Bearer
        expires_in: 3600
        refresh_token: atr_live_EXAMPLE_NOT_A_REAL_TOKEN
        scope: sites:read sites:write

    OAuthError:
      type: object
      description: |
        RFC 6749 section 5.2 - **not** this API's error shape. The *Connect*
        endpoints answer with this; every other route answers with `Error`.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - invalid_scope
            - unauthorized_client
            - unsupported_grant_type
            - unsupported_response_type
            - access_denied
            - server_error
            - temporarily_unavailable
        error_description:
          type: string
          description: For a developer reading a log. Never stable, never machine-readable.
        error_uri:
          type: string
      example:
        error: invalid_grant
        error_description: That authorization code is not valid.

    SiteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Site"
          description: Every site the credential reaches, ordered by `name` with `id` as the tiebreak. Not paginated.

    Event:
      type: object
      required: [id, event_type, decision, occurred_at, occurred_at_trusted, recorded_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          description: Uppercase token, for example `ACCESS_GRANTED` or `ACCESS_DENIED`. Open — new types may appear.
        decision:
          type: string
          enum: [GRANTED, DENIED, RECORDED, ERROR]
          description: Closed set.
        reason:
          type: string
          description: Machine-readable, for example `ALLOWED`, `NO_PERMISSION`, `OUTSIDE_SCHEDULE`, `PERSON_INACTIVE`, `PERSON_UNKNOWN`. Absent when the terminal gave none; open.
        direction:
          type: string
          enum: [IN, OUT]
          description: Absent when not applicable.
        application:
          type: string
          description: The capability that produced the event; absent for platform events.
        member_id:
          type: string
          description: The member the platform matched. **Absent when nobody was matched.**
        member:
          type: string
          format: uuid
          description: That member's `id`.
        subject:
          type: string
          description: What the terminal read, kept so an unmatched attempt is still traceable.
        site_id:
          type: string
          format: uuid
          description: Absent for an event with no site.
        terminal_serial:
          type: string
          description: Absent when the terminal is unknown.
        occurred_at:
          type: string
          format: date-time
          description: When it happened **at the terminal**.
        occurred_at_trusted:
          type: boolean
          description: Whether the terminal's clock was believable; `false` means `occurred_at` is the server's arrival time.
        recorded_at:
          type: string
          format: date-time
          description: When the server heard about it — hours after `occurred_at` for a queued upload.
      example:
        id: b86cbd42-0a1c-40cc-b641-1e01ff7fc58a
        event_type: ACCESS_DENIED
        decision: DENIED
        reason: OUTSIDE_SCHEDULE
        member_id: P4-EV-001
        member: 378bddff-8412-41e1-be6e-8a44829c0a69
        subject: P-AUTH
        site_id: 96126c0e-0e81-4bbb-81ba-da4fb4b29081
        terminal_serial: P4-EV-A
        occurred_at: "2026-09-11T12:14:00Z"
        occurred_at_trusted: true
        recorded_at: "2026-09-11T19:20:46.187594Z"

    EventPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]

    # --- console API ---------------------------------------------------------

    ConsoleError:
      type: object
      description: The console API's error shape — a single sentence for a person to read.
      required: [error]
      properties:
        error:
          type: string
      example:
        error: Person not found

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      example:
        email: integrations@example.com
        password: "<password>"

    Session:
      type: object
      description: Returned identically by `login` and `/me`. An object, deliberately — new fields are added without breaking clients.
      required: [operator, company, role, sites, all_sites, applications, csrf_token, session_expires_at, session_expires_in_seconds]
      properties:
        operator:
          type: object
          required: [id, email, full_name, role]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            full_name: { type: string }
            role:
              type: string
              enum: [OWNER, ADMIN, MANAGER, VIEWER]
        company:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        role:
          type: string
          enum: [OWNER, ADMIN, MANAGER, VIEWER]
        sites:
          type: array
          description: The operator's explicit site grants, possibly empty.
          items:
            type: object
            properties:
              site_id: { type: string, format: uuid }
              site_name: { type: string }
        all_sites:
          type: boolean
          description: Whether the operator reaches every site in the company (always true for OWNER and ADMIN, and for anyone holding no grants).
        applications:
          type: array
          description: The capabilities the company has enabled.
          items:
            type: object
            properties:
              code: { type: string }
              settings: { type: object }
        must_change_password:
          type: boolean
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on every console request that is not `GET`.
        session_expires_at:
          type: string
          format: date-time
        session_expires_in_seconds:
          type: integer
          description: Resolved server-side; prefer it over the absolute timestamp when scheduling.
      example:
        operator:
          id: 1f0c2a3e-4d5b-4c6d-8e7f-9a0b1c2d3e4f
          email: integrations@example.com
          full_name: Integration Bot
          role: MANAGER
        company:
          id: 9b2a7c1d-0e3f-4a5b-8c6d-7e8f9a0b1c2d
          name: Acme Fitness
          slug: acme-fitness
        role: MANAGER
        sites: []
        all_sites: true
        applications:
          - code: ACCESS_CONTROL
            settings: {}
        must_change_password: false
        csrf_token: "<csrf-token>"
        session_expires_at: "2026-09-22T09:12:33Z"
        session_expires_in_seconds: 604800

    EnrollmentStartRequest:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          maxLength: 31
          description: The person to enrol — the value the public API calls `member_id`. Must exist in the operator's company.
        expires_in_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
          description: How long the terminal waits for a finger. Values outside the bounds are clamped to them.
      example:
        external_id: MEM042
        expires_in_seconds: 300

    Enrollment:
      type: object
      required: [id, status, external_id, terminal_serial, created_at, biometric_enrolled]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED, EXPIRED, CANCELLED]
        external_id:
          type: string
        full_name:
          type: string
        terminal_serial:
          type: string
        terminal_name:
          type: string
        site_name:
          type: string
        site_public_id:
          type: string
          format: uuid
        terminal_status:
          type: string
          description: The terminal's current health (for example `ONLINE`, `OFFLINE`), so a caller can tell a queued request from one the terminal has seen.
        error_message:
          type: string
          description: The terminal's own words, when `status` is `FAILED`.
        requested_by_email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        biometric_enrolled:
          type: boolean
          description: Whether the person now has a fingerprint enrolled. Never the fingerprint itself.
      example:
        id: 0d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
        status: PENDING
        external_id: MEM042
        full_name: Ada Lovelace
        terminal_serial: AT-E05A1B38AA38
        terminal_name: Reception
        site_name: Lagos Depot
        site_public_id: 46e57753-0143-481a-83f6-e93a36cfb9a7
        terminal_status: ONLINE
        requested_by_email: integrations@example.com
        created_at: "2026-09-15T10:00:00Z"
        expires_at: "2026-09-15T10:05:00Z"
        biometric_enrolled: false

    PersonEnrollment:
      type: object
      required: [external_id, biometric_enrolled, enrollment]
      properties:
        external_id:
          type: string
        biometric_enrolled:
          type: boolean
          description: Whether the person currently has a fingerprint enrolled.
        enrollment:
          oneOf:
            - $ref: "#/components/schemas/Enrollment"
            - type: "null"
          description: The person's most recent enrolment, or `null` when none has ever been started — a different fact from "the last one failed".
      example:
        external_id: MEM042
        biometric_enrolled: false
        enrollment: null

  responses:
    Unauthorized:
      description: No credential, a malformed one, one of the other environment, or one that is unknown, revoked, expired or rotated out.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              summary: api_credential_missing
              value:
                error:
                  type: authentication_error
                  code: api_credential_missing
                  message: "No credential was presented. Send Authorization: Bearer <your key>."
                  request_id: 6e4a99b280eb9e6e
                  doc_url: https://accesslink.store/docs/errors/api_credential_missing
            invalid:
              summary: api_credential_invalid
              value:
                error:
                  type: authentication_error
                  code: api_credential_invalid
                  message: The credential presented is not valid.
                  request_id: 1a2b3c4d5e6f7a8b
                  doc_url: https://accesslink.store/docs/errors/api_credential_invalid
    Forbidden:
      description: The key lacks the scope this route requires (checked before any lookup).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: permission_error
              code: insufficient_scope
              message: This credential does not carry the scope this endpoint requires.
              request_id: d1566e1129a1f7bb
              doc_url: https://accesslink.store/docs/errors/insufficient_scope
    NotFound:
      description: No such resource in this company — the same answer for one that never existed and one that belongs to another company.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: not_found_error
              code: resource_not_found
              message: No such resource.
              request_id: 5cf64ccbac9a0b34
              doc_url: https://accesslink.store/docs/errors/resource_not_found
    RateLimited:
      description: Your key's or your company's allowance is spent.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: rate_limit_error
              code: rate_limit_exceeded
              message: Rate limit exceeded.
              request_id: 5fc50d5d15152eb7
              doc_url: https://accesslink.store/docs/errors/rate_limit_exceeded
    ServiceUnavailable:
      description: A dependency (the database or the rate-limit store) could not be consulted. Retry after `Retry-After`.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: api_error
              code: service_unavailable
              message: A dependency is temporarily unavailable. Please retry.
              request_id: 0c9d8e7f6a5b4c3d
              doc_url: https://accesslink.store/docs/errors/service_unavailable
    ConsoleUnauthorized:
      description: No session cookie, or an invalid or expired session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsoleError"
          example:
            error: Authentication required
    ConsoleForbidden:
      description: The CSRF token is missing or invalid, the operator's role is below the route's minimum, or the terminal is outside the operator's site grants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsoleError"
          example:
            error: Insufficient permissions

# Every public error code the server can emit, with the type and status it is
# always served with. openapi_docs_test.go holds this list equal to
# models.APIErrors, and scripts/build-errors.mjs turns it into the
# /errors/<code>/ pages that every doc_url points at.
x-accesslink-error-codes:
  - { code: api_credential_missing, type: authentication_error, status: 401, message: "No credential was presented. Send Authorization: Bearer <your key>.", reserved: false }
  - { code: api_credential_invalid, type: authentication_error, status: 401, message: "The credential presented is not valid.", reserved: false }
  - { code: api_credential_expired, type: authentication_error, status: 401, message: "This credential has expired. Issue a new one from the console.", reserved: true }
  - { code: api_credential_revoked, type: authentication_error, status: 401, message: "This credential has been revoked.", reserved: true }
