paths:
  # ==========================================================================
  # PUBLIC API
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Connect - the OAuth authorization server.
  #
  # THE ONLY ROUTES IN THIS DOCUMENT REACHED WITHOUT A CREDENTIAL, and the only
  # ones that answer in the OAuth error shape. Everything else answers with the
  # AccessLink envelope.
  # --------------------------------------------------------------------------

  /api/public/v1/oauth/authorize:
    get:
      tags: [Connect]
      operationId: authorize
      summary: Start a connection
      description: |
        Send the customer's browser here. AccessLink signs them in if they are
        not already, shows them exactly which permissions you are asking for,
        and returns them to your `redirect_uri` with a single-use `code`.

        **PKCE is mandatory.** Generate a `code_verifier` (43–128 characters
        from `A–Z a–z 0–9 - . _ ~`), send its SHA-256 as `code_challenge`
        (base64url, no padding) with `code_challenge_method=S256`, and keep the
        verifier to send to the token endpoint. Send a `state` you can check on
        the way back; it is returned unchanged.

        **Where errors go.** If the `client_id` is not one we know, or the
        `redirect_uri` is not one registered for it, AccessLink shows the
        customer a page and returns them nowhere — redirecting on an
        unverified address would make this an open redirector. Every other
        failure returns them to your registered `redirect_uri` with `error`,
        `error_description` and your `state`. A customer who declines is
        `error=access_denied`.
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          description: Must be `code`.
          schema: { type: string, enum: [code] }
          example: code
        - name: client_id
          in: query
          required: true
          description: Your client identifier, as configured with AccessLink.
          schema: { type: string }
          example: datavase
        - name: redirect_uri
          in: query
          required: true
          description: |
            Where to return the customer. Compared **exactly** against the
            addresses registered for your client — no prefix or wildcard match.
          schema: { type: string, format: uri }
          example: https://app.datavase.example/integrations/accesslink/callback
        - name: scope
          in: query
          required: false
          description: |
            Space-delimited. Omit to ask for everything your client is
            registered for. A scope your client is not registered for is
            `error=invalid_scope`.
          schema: { type: string }
          example: sites:read sites:write
        - name: state
          in: query
          required: false
          description: Opaque value returned unchanged. Use it to tie the callback to the request you made.
          schema: { type: string, maxLength: 512 }
          example: dG9rZW4tYmluZGluZy1zdGF0ZQ
        - name: code_challenge
          in: query
          required: true
          description: base64url SHA-256 of your `code_verifier`, no padding (43 characters).
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        - name: code_challenge_method
          in: query
          required: true
          description: Must be `S256`. `plain` is not accepted.
          schema: { type: string, enum: [S256] }
          example: S256
      responses:
        "200":
          description: |
            The AccessLink sign-in or consent page, as HTML. Nothing to parse —
            the customer reads it and decides.
          content:
            text/html:
              schema: { type: string }
        "303":
          description: |
            The customer is returned to your `redirect_uri` with either `code`
            and `state`, or `error`, `error_description` and `state`.
          headers:
            Location:
              description: Your `redirect_uri` with the result appended as query parameters.
              schema: { type: string, format: uri }
        "400":
          description: |
            An HTML page. The request could not be returned anywhere safely:
            the `client_id` is unknown or the `redirect_uri` is not registered.
          content:
            text/html:
              schema: { type: string }
        "429":
          description: Too many requests from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "503":
          description: AccessLink could not check the request just now.
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [Connect]
      operationId: authorizeSubmit
      summary: Submit the sign-in or consent form
      description: |
        **The customer's browser posts this form; your application never calls
        it.** It is the target of the sign-in and consent pages that
        `GET /api/public/v1/oauth/authorize` renders, and it is documented only
        so the flow can be read end to end.

        The form restates the whole authorization request, which AccessLink
        re-checks against the registered client before it acts on it, and
        carries a single-use token that must match a cookie set when the page
        was rendered.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [response_type, client_id, redirect_uri, code_challenge, code_challenge_method, form_token]
              properties:
                response_type: { type: string, enum: [code] }
                client_id: { type: string }
                redirect_uri: { type: string, format: uri }
                scope: { type: string }
                state: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string, enum: [S256] }
                form_token:
                  type: string
                  description: The single-use value from the rendered page.
                action:
                  type: string
                  enum: [signin, allow, deny]
                  description: |
                    `signin` submits the sign-in form and shows the consent
                    screen; signing in is never consenting. `allow` grants,
                    anything else declines.
                email: { type: string, format: email, description: Only with `action=signin`. }
                password: { type: string, format: password, description: Only with `action=signin`. }
      responses:
        "200":
          description: The next page - the consent screen, or the sign-in form again with a message.
          content:
            text/html:
              schema: { type: string }
        "303":
          description: The customer is returned to the registered `redirect_uri` with `code` or `error`.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400":
          description: An HTML page; the request could not be returned anywhere safely.
          content:
            text/html:
              schema: { type: string }
        "429":
          description: Too many requests from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "503":
          description: AccessLink could not check the request just now.
          content:
            text/html:
              schema: { type: string }

  /api/public/v1/oauth/token:
    post:
      tags: [Connect]
      operationId: token
      summary: Exchange a code, or refresh
      description: |
        Form-encoded in, JSON out. Two grant types.

        **`authorization_code`** exchanges the `code` from the callback for
        tokens. Send the same `redirect_uri` you started with and the
        `code_verifier` whose challenge you sent. A code is single-use and
        expires in two minutes; presenting one twice revokes whatever the first
        exchange produced.

        **`refresh_token`** exchanges a refresh token for a new pair.
        **Refresh tokens rotate:** every refresh returns a new one and retires
        the one you sent. Store the new one before you use it. Presenting a
        retired refresh token means two parties hold tokens from one
        connection, so AccessLink revokes the whole connection and the customer
        must reconnect — that is the point of rotation, and it is why a
        refresh must not be retried with the old token after a network failure.
        Send `scope` to narrow the grant; a scope outside it is refused rather
        than trimmed.

        Authenticate as your client with HTTP Basic (`client_id` as the
        username) or with `client_id` and `client_secret` in the form. A client
        registered without a secret sends neither.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code: { type: string, description: With `authorization_code`. }
                redirect_uri:
                  type: string
                  format: uri
                  description: With `authorization_code`; must equal the one used to obtain the code.
                code_verifier:
                  type: string
                  minLength: 43
                  maxLength: 128
                  description: With `authorization_code`; the PKCE verifier.
                refresh_token: { type: string, description: With `refresh_token`. }
                scope: { type: string, description: With `refresh_token`, to narrow the grant. }
                client_id: { type: string }
                client_secret: { type: string, format: password }
      responses:
        "200":
          description: The tokens.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: |
            `invalid_grant` (the code or refresh token is unknown, expired,
            already used, for another client, or the `redirect_uri` or
            `code_verifier` does not match), `invalid_request`,
            `invalid_scope`, `unsupported_grant_type`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              examples:
                badCode:
                  summary: The code is not valid
                  value:
                    error: invalid_grant
                    error_description: That authorization code is not valid.
                reuse:
                  summary: A retired refresh token was presented
                  value:
                    error: invalid_grant
                    error_description: That refresh token is not valid. The grant has been revoked; the account holder must reconnect.
        "401":
          description: "`invalid_client` - the client is unknown or its secret did not match."
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: Too many requests from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "503":
          description: "`temporarily_unavailable`. Retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /api/public/v1/oauth/revoke:
    post:
      tags: [Connect]
      operationId: revoke
      summary: Disconnect
      description: |
        RFC 7009. Send a refresh token to end the whole connection, or an access
        token to end just that token.

        **Always `200` once your client is authenticated**, whether or not the
        token existed — a client cleaning up should not have to tell "already
        gone" from "never yours", and an endpoint that did would confirm a
        guessed token to whoever asked.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: Optional and ignored; the token's own form says which it is.
                client_id: { type: string }
                client_secret: { type: string, format: password }
      responses:
        "200":
          description: Revoked, or there was nothing to revoke. No body.
        "400":
          description: "`invalid_request` - no `token` was sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: "`invalid_client`."
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: Too many requests from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "503":
          description: "`temporarily_unavailable`. Retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /api/public/v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members
      description: |
        Requires scope `members:read`. Paginated, newest first. No filters in
        this version — any query parameter other than `limit` and `cursor` is
        `400 unknown_parameter`.
      security:
        - IntegrationCredential: []
      x-scope: members:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of members.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimit-Limit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimit-Remaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimit-Reset" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimit-Policy" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
              examples:
                firstPage:
                  summary: First page of two (limit=2)
                  value:
                    data:
                      - id: 94ed94c2-6984-40eb-a19b-7dc752caaa9e
                        member_id: MEM003
                        full_name: Alan Turing
                        membership_type: ANNUAL
                        active: true
                        created_at: "2026-09-11T10:35:00.389158Z"
                        updated_at: "2026-09-11T10:35:00.389158Z"
                      - id: 30aa0802-c537-4fad-a647-7035d0c5a398
                        member_id: MEM002
                        full_name: Grace Hopper
                        membership_type: MONTHLY
                        active: true
                        created_at: "2026-09-11T10:35:00.347723Z"
                        updated_at: "2026-09-11T10:35:00.347723Z"
                    has_more: true
                    next_cursor: AkwiRQG6XwT_h0mx7hNHjFINCEMZ8SszybWW7dDh0ZFrJLn0-v7op9IzDmBk3OXLpfxjtfMg8mUAJ_SawP211X5E-odV1sKaKWmn4z23nOEAmv1YpfVvPWYFRCSTaZLu7FBVd8PJPFVJxYcU8lFJbYDcu6fY
                lastPage:
                  summary: The last page — has_more is false and next_cursor is null
                  value:
                    data:
                      - id: ac8f7af9-9fb2-4bcf-97f8-a9ff2f5e0070
                        member_id: MEM001
                        full_name: Ada Lovelace
                        membership_type: ANNUAL
                        active: true
                        created_at: "2026-09-11T10:35:00.289175Z"
                        updated_at: "2026-09-11T10:35:00.289175Z"
                    has_more: false
                    next_cursor: null
        "400":
          description: "`invalid_field` on `limit`, `unknown_parameter`, `tenant_identity_not_permitted`, or `cursor_invalid`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                limit:
                  summary: A limit outside 1–200
                  value:
                    error:
                      type: invalid_request_error
                      code: invalid_field
                      message: limit must be an integer between 1 and 200.
                      param: limit
                      request_id: 2f54349499400475
                      doc_url: https://accesslink.store/docs/errors/invalid_field
                tenant:
                  summary: A request that tries to name its tenant
                  value:
                    error:
                      type: invalid_request_error
                      code: tenant_identity_not_permitted
                      message: The account is determined by your credential and cannot be supplied in a request.
                      param: company_id
                      request_id: e6e7d3d987e1531a
                      doc_url: https://accesslink.store/docs/errors/tenant_identity_not_permitted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: "`cursor_expired` — the cursor points past retained data. Member cursors do not expire in this version."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Members]
      operationId: createMember
      summary: Create a member
      description: |
        Requires scope `members:write`. Creates the member with the company's
        default access rule; terminals pick them up on their next sync.

        `membership_type` defaults to `STANDARD` and `active` to `true`. The
        body must be a single JSON object of at most 64 KiB; a field this
        version does not define — including `fingerprint_template` — is
        `400 unknown_field`. Send an `Idempotency-Key` so a retried request
        cannot create a duplicate.
      security:
        - IntegrationCredential: []
      x-scope: members:write
      parameters:
