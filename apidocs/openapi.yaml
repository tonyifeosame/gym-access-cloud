        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/public/v1/sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List sites
      description: |
        Requires scope `sites:read`. **Not paginated** — every live site the
        key reaches, ordered by `name`; `[]` when there are none. A
        site-restricted key sees only the sites in its set.
      security:
        - IntegrationCredential: []
      x-scope: sites:read
      responses:
        "200":
          description: The sites.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimit-Remaining" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
              examples:
                unrestricted:
                  summary: An unrestricted credential in a company with two sites
                  value:
                    data:
                      - id: 3e2550b2-d1cd-4d0a-915d-dd79c68120e5
                        name: Abuja Studio
                        address: ""
                        country: NG
                        timezone: Africa/Lagos
                        active: true
                        terminal_count: 0
                        created_at: "2026-09-11T10:34:35.327588Z"
                      - id: 46e57753-0143-481a-83f6-e93a36cfb9a7
                        name: Lagos Depot
                        address: 14 Marina Road
                        country: NG
                        timezone: Africa/Lagos
                        active: true
                        terminal_count: 0
                        created_at: "2026-09-11T10:34:35.32243Z"
                restricted:
                  summary: The same company, a credential restricted to one site
                  value:
                    data:
                      - id: 46e57753-0143-481a-83f6-e93a36cfb9a7
                        name: Lagos Depot
                        address: 14 Marina Road
                        country: NG
                        timezone: Africa/Lagos
                        active: true
                        terminal_count: 0
                        created_at: "2026-09-11T10:34:35.32243Z"
        "400":
          description: "`unknown_parameter`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

    post:
      tags: [Sites]
      operationId: createSite
      summary: Create a site
      description: |
        Requires scope `sites:write`. Creates a location in your account and
        returns it. `name`, `country` and `timezone` are all required: a site
        created unattended has nobody to fill a blank in later, and the timezone
        is what access schedules at that site are evaluated in.

        The name must be unique among your live sites, case-insensitively —
        a duplicate is `409 site_name_already_exists`, which also makes a
        retried create safe: the second attempt is refused rather than quietly
        producing a second location.

        The site is created active and with no terminals. Registering hardware
        at it is done from the console; nothing in this API returns or rotates a
        site's provisioning key.

        **A key restricted to named sites cannot create** — `403
        site_not_permitted`. A restriction can only name sites that already
        exist, and a key that could create a site it would then be unable to
        read or change is a capability nobody chose.

        **Retrying an ambiguous create.** If your request timed out and you do
        not know whether it landed, retry it: `201` means it had not, and `409`
        means it had — `GET /sites` then gives you the site, matched on the name
        you sent. `Idempotency-Key` is not needed here and is not honoured on a
        request authenticated with an access token.
      security:
        - IntegrationCredential: []
        - DatavaseOAuth: [sites:write]
      x-scope: sites:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
            examples:
              minimal:
                summary: The three required fields
                value:
                  name: Abuja Studio
                  country: NG
                  timezone: Africa/Lagos
              withAddress:
                summary: With a street address
                value:
                  name: Lagos Depot
                  address: 14 Marina Road
                  country: NG
                  timezone: Africa/Lagos
      responses:
        "201":
          description: The site as created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: |
            `missing_field` (`name`, `country` or `timezone`), `invalid_field`
            (an unusable country or timezone, or `active`), `unknown_field`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  type: invalid_request_error
                  code: invalid_field
                  message: country must be an ISO 3166-1 alpha-2 code such as NG, GB or US.
                  param: country
                  request_id: 9b1c0e6a4f2d7c31
                  doc_url: https://accesslink.store/docs/errors/invalid_field
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`insufficient_scope`, or `site_not_permitted` when the key is restricted to named sites."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  type: permission_error
                  code: site_not_permitted
                  message: This credential is restricted to named sites, so it cannot create new ones. A credential that may add sites must not be restricted to a set of them.
                  request_id: 433be31abd341a5c
                  doc_url: https://accesslink.store/docs/errors/site_not_permitted
        "409":
          description: "`site_name_already_exists`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  type: conflict_error
                  code: site_name_already_exists
                  message: A site with that name already exists in this account.
                  param: name
                  request_id: 3d5f7a91c0b24e88
                  doc_url: https://accesslink.store/docs/errors/site_name_already_exists
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/public/v1/sites/{site_id}:
    parameters:
      - $ref: "#/components/parameters/siteId"
    get:
      tags: [Sites]
      operationId: getSite
      summary: Get a site
      description: |
        Requires scope `sites:read`. A site that is not in this company,
        retired, or whose id is malformed is `404 resource_not_found`; a site in
        this company but outside the key's site restriction is
        `403 site_not_permitted`.
      security:
        - IntegrationCredential: []
      x-scope: sites:read
      responses:
        "200":
          description: The site.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimit-Remaining" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`insufficient_scope`, or `site_not_permitted` for a site outside the key's restriction."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  type: permission_error
                  code: site_not_permitted
                  message: This credential is not scoped to that site.
                  request_id: 433be31abd341a5c
                  doc_url: https://accesslink.store/docs/errors/site_not_permitted
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

    patch:
      tags: [Sites]
      operationId: updateSite
      summary: Update a site
      description: |
        Requires scope `sites:write`, and the key or token must reach the site.
        Partial: supply at least one of `name`, `address`, `country`, `timezone`
        or `active`, and anything you leave out keeps its value.

        `active: false` stops the site's terminals authenticating immediately.
        It is reversible and destroys nothing — it is not the same as retiring a
        site, which this API cannot do.

        A site that is not in this account, retired, or whose id is malformed is
        `404 resource_not_found`; a site in this account but outside the key's
        site restriction is `403 site_not_permitted`.
      security:
        - IntegrationCredential: []
        - DatavaseOAuth: [sites:write]
      x-scope: sites:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
            examples:
              correctTheZone:
                summary: Correct the timezone
                value:
                  timezone: Africa/Lagos
              closeForTheSeason:
                summary: Deactivate the site
                value:
                  active: false
      responses:
        "200":
          description: The site as it now stands.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: |
            `invalid_field` (an empty or unusable name, country or timezone, or
            a body with none of the five fields), `unknown_field`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`insufficient_scope`, or `site_not_permitted` for a site outside the key's restriction."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`site_name_already_exists`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/public/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: |
        Requires scope `events:read`. Paginated, **newest `occurred_at` first**.
        The filters are part of the cursor: a `next_cursor` presented with
        different filters is `400 cursor_invalid`.

        **A filter that names something the key cannot see is an empty page,
        not an error.** A `member_id` or `site_id` in another company, a site
        outside the key's restriction, or a malformed `site_id` all return
        `"data": []`. A site-restricted key sees only events at its sites; an
        event with no site is not visible to it.
      security:
        - IntegrationCredential: []
      x-scope: events:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: member_id
          in: query
          required: false
          description: Only events matched to this member.
          schema:
            type: string
        - name: site_id
          in: query
          required: false
          description: Only events at this site (public UUID).
          schema:
            type: string
            format: uuid
        - name: decision
          in: query
          required: false
          description: Only this outcome. Case-insensitive; any other value is `400 invalid_field`.
          schema:
            type: string
            enum: [GRANTED, DENIED, RECORDED, ERROR]
        - name: from
          in: query
          required: false
          description: "`occurred_at >= from`, RFC 3339. Not parseable is `400 invalid_timestamp`."
          schema:
            type: string
            format: date-time
          example: "2026-09-11T00:00:00Z"
        - name: to
          in: query
          required: false
          description: "`occurred_at < to`, RFC 3339. Must be later than `from`, else `400 invalid_field`."
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of events.
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimit-Limit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimit-Remaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimit-Reset" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimit-Policy" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
              example:
                data:
                  - id: 97f97eca-921e-4522-9ecd-7bafac6b181d
                    event_type: ACCESS_DENIED
                    decision: DENIED
                    reason: PERSON_UNKNOWN
                    subject: P-AUTH
                    site_id: 96126c0e-0e81-4bbb-81ba-da4fb4b29081
                    terminal_serial: P4-EV-A
                    occurred_at: "2026-09-11T14:14:00Z"
                    occurred_at_trusted: true
                    recorded_at: "2026-09-11T19:20:46.189826Z"
                  - id: b86cbd42-0a1c-40cc-b641-1e01ff7fc58a
                    event_type: ACCESS_DENIED
                    decision: DENIED
                    reason: OUTSIDE_SCHEDULE
                    member_id: P4-EV-001
                    member: 378bddff-8412-41e1-be6e-8a44829c0a69
                    subject: P-AUTH
                    site_id: 96126c0e-0e81-4bbb-81ba-da4fb4b29081
                    terminal_serial: P4-EV-A
                    occurred_at: "2026-09-11T12:14:00Z"
                    occurred_at_trusted: true
                    recorded_at: "2026-09-11T19:20:46.187594Z"
                has_more: true
                next_cursor: Ao7gOw6Tc1Tkea7RH3Rea183EU0WTJc8emJQwQZobSl7pcOwbG2gfPfZNKG2rNm-ttNdbRGJ0TXbRs3Gb33MqhXSvxBtFenXRTdBLx5pw0WfhYnRi33_0ML_vaBj9VXFSslqspthqGJsPeQPCP8
        "400":
          description: "`invalid_field` (`limit`, `decision`, `to`), `invalid_timestamp` (`from`, `to`), `unknown_parameter`, `tenant_identity_not_permitted` or `cursor_invalid`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  type: invalid_request_error
                  code: invalid_timestamp
                  message: A timestamp could not be read. Use RFC 3339, for example 2026-09-09T17:00:00Z.
                  param: from
                  request_id: 312d5010d71e231c
                  doc_url: https://accesslink.store/docs/errors/invalid_timestamp
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: "`cursor_expired`. Event cursors do not expire in this version."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ==========================================================================
  # CONSOLE API (operator session) — the slice fingerprint enrolment needs
  # ==========================================================================

  /api/v1/auth/login:
    post:
      tags: [Console session]
      operationId: consoleLogin
      summary: Sign in
      description: |
        Exchanges an operator's email and password for a session. The body
        **must** be `application/json` (a form-encoded body is refused). On
        success the session cookie is set and the session body — including the
        `csrf_token` every later write needs — is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The `Set-Cookie` header carries the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The body is not JSON or is missing a field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
              example:
                error: Invalid email or password
        "429":
          description: Too many attempts from this address or for this account. Wait for `Retry-After`.
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"

  /api/v1/auth/me:
    get:
      tags: [Console session]
      operationId: consoleMe
      summary: Read the current session
      description: The same body `login` returned, for the session the cookie names — including a fresh `csrf_token`.
      security:
        - OperatorSession: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401": { $ref: "#/components/responses/ConsoleUnauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [Console session]
      operationId: consoleLogout
      summary: Sign out
      description: Revokes the session and clears the cookie. Requires the `X-CSRF-Token` header. A copy of the cookie is worthless afterwards.
      security:
        - OperatorSession: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Signed out.
        "401": { $ref: "#/components/responses/ConsoleUnauthorized" }
        "403": { $ref: "#/components/responses/ConsoleForbidden" }

  /api/v1/console/terminals/{serial}/enrollments:
    parameters:
      - $ref: "#/components/parameters/serial"
    post:
      tags: [Fingerprint enrolment]
      operationId: consoleStartEnrollment
      summary: Start a fingerprint enrolment at a terminal
      description: |
        Asks **one** terminal to capture the named person's fingerprint. The
        operator must be a **Manager** or above with a grant on the terminal's
        site; the person must exist in the operator's company; the terminal must
        be provisioned, enabled and not retired. The person must be standing at
        the terminal — it enters enrolment mode for `expires_in_seconds`
        (default 300, clamped to 30–3600) and returns to normal service when the
        capture completes, fails, or the window closes.

        The captured fingerprint is stored on that terminal; no route returns
        it. Follow progress with *Read a person's enrolment*.
      security:
        - OperatorSession: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentStartRequest"
      responses:
        "201":
          description: The enrolment, in state `PENDING` until the terminal collects it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: The body is missing `external_id` or is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "401": { $ref: "#/components/responses/ConsoleUnauthorized" }
        "403": { $ref: "#/components/responses/ConsoleForbidden" }
        "404":
          description: The person, or the terminal, is not in the operator's company. (A terminal in the company but outside the operator's site grants is `403`.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
              example:
                error: Person not found
        "409":
          description: The terminal cannot run an enrolment — it is disabled, retired, or has never been provisioned with a credential of its own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
              example:
                error: That terminal cannot run an enrolment. It is disabled, retired, or has never been provisioned with a credential of its own.

  /api/v1/console/people/{external_id}/enrollment:
    parameters:
      - $ref: "#/components/parameters/externalId"
    get:
      tags: [Fingerprint enrolment]
      operationId: consoleGetPersonEnrollment
      summary: Read a person's enrolment
      description: |
        The person's most recent enrolment and whether they currently have a
        fingerprint enrolled, in one response. `enrollment` is `null` when none
        has ever been started. Poll this while an enrolment is `PENDING` or
        `IN_PROGRESS`; a couple of seconds between reads is plenty.
      security:
        - OperatorSession: []
      responses:
        "200":
          description: The person's enrolment state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonEnrollment"
              examples:
                never:
                  summary: Never enrolled
                  value:
                    external_id: MEM042
                    biometric_enrolled: false
                    enrollment: null
                completed:
                  summary: A capture that succeeded
                  value:
                    external_id: MEM042
                    biometric_enrolled: true
                    enrollment:
                      id: 0d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
                      status: COMPLETED
                      external_id: MEM042
                      full_name: Ada Lovelace
                      terminal_serial: AT-E05A1B38AA38
                      terminal_name: Reception
                      site_name: Lagos Depot
                      site_public_id: 46e57753-0143-481a-83f6-e93a36cfb9a7
                      terminal_status: ONLINE
                      requested_by_email: integrations@example.com
                      created_at: "2026-09-15T10:00:00Z"
                      expires_at: "2026-09-15T10:05:00Z"
                      started_at: "2026-09-15T10:00:12Z"
                      completed_at: "2026-09-15T10:00:41Z"
                      biometric_enrolled: true
        "401": { $ref: "#/components/responses/ConsoleUnauthorized" }
        "404":
          description: The person is not in the operator's company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
    delete:
      tags: [Fingerprint enrolment]
      operationId: consoleCancelEnrollment
      summary: Cancel a person's enrolment
      description: |
        Stops whatever enrolment is live for the person, whichever terminal it
        was sent to, and returns it in state `CANCELLED`. Manager or above, with
        the `X-CSRF-Token` header.
      security:
        - OperatorSession: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The cancelled enrolment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "401": { $ref: "#/components/responses/ConsoleUnauthorized" }
        "403": { $ref: "#/components/responses/ConsoleForbidden" }
        "404":
          description: The person is not in the operator's company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "409":
          description: There is no enrolment in progress for this person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
              example:
                error: There is no enrolment in progress for this person
