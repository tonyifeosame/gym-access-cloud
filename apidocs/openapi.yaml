                  value:
                    member_id: MEM042
                    active: true
                    rules:
                      - id: a30363e0-f216-4b47-83f9-b45bd74ef19f
                        scope: COMPANY
                        effect: ALLOW
                        standing: IN_FORCE
                scheduled:
