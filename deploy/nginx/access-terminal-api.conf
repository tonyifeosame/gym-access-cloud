# Nginx site for the Access Terminal Cloud API.
#
# The API speaks plain HTTP and expects TLS to be terminated in front of it.
# This is that front. Nothing else may reach port 8080.
#
# THE HOSTNAME IS api.accesslink.store, written out in full below rather than
# templated. Three places also carry the certificate paths, which certbot writes
# using the same name. There is deliberately no variable for it -- an nginx
# server_name cannot be templated, and a half-substituted config that still
# starts is worse than one that does not.
#
# To retarget this file at a different name, substitute all of them at once:
#
#   sed -i 's/api\.accesslink\.store/api.otherdomain.tld/g' access-terminal-api.conf
#
# --------------------------------------------------------------------------
# WHAT THE ESP32 CONSTRAINS, which is most of the TLS policy below
# --------------------------------------------------------------------------
#
# 1. TLS 1.2 MUST stay enabled. The terminals run mbedTLS via the ESP32 Arduino
#    core; TLS 1.3 support there is version-dependent and not guaranteed. A
#    1.3-only server is the kind of hardening that locks out the entire fleet
#    and cannot be fixed remotely, because the fix would have to arrive over the
#    connection that no longer works.
#
# 2. The terminals pin the ROOT of this chain, not the leaf -- see
#    include/root_ca.h in the firmware repository. With Let's Encrypt those
#    roots are ISRG Root X1 (RSA) and ISRG Root X2 (ECDSA). Pinning a leaf would
#    break every terminal on renewal day, roughly ninety days after deployment,
#    all at once.
#
#    GET THE ROOTS FROM THE CA, NOT FROM THIS SERVER:
#      curl -O https://letsencrypt.org/certs/isrgrootx1.pem
#      curl -O https://letsencrypt.org/certs/isrg-root-x2.pem
#
#    Do NOT take the last certificate from `openssl s_client -showcerts`. A
#    server does not send the root -- it sends leaf + intermediate -- so the
#    last certificate is the INTERMEDIATE, which the CA rotates on its own
#    schedule. Pinning it strands the fleet on a day nobody chose. The command
#    appears to work, which is what makes it worth the warning.
#
# 3. OCSP stapling is on. An ESP32 will not fetch OCSP itself, so stapling is
#    what lets revocation be visible to clients that cannot go and ask.
#
# 4. HTTP/2 is fine -- the ESP32 negotiates HTTP/1.1 and the server falls back.

# --------------------------------------------------------------------------
# Rate limiting.
#
# The API has NONE of its own -- confirmed by grep across the tree. Registration
# is the endpoint that matters: it is authenticated only by the shared site key,
# and a successful call ROTATES the credential of the named serial. So an
# attacker with a leaked site key can knock a terminal off the fleet repeatedly,
# and a brute-force against the key is otherwise unbounded.
#
# These zones live in http{} scope. If this file is included from conf.d/ they
# belong in nginx.conf instead; nginx will tell you plainly if they are in the
# wrong place.
# --------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=at_register:1m  rate=6r/m;
limit_req_zone $binary_remote_addr zone=at_device:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=at_api:10m      rate=600r/m;
limit_conn_zone $binary_remote_addr zone=at_conn:10m;

# Terminals reconnect on their own schedule; a rejection is cheap for them and
# expensive for an attacker.
limit_req_status 429;
limit_conn_status 429;

upstream access_terminal_api {
    # Matches the loopback publish in deploy/docker-compose.prod.yml.
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --------------------------------------------------------------------------
# :80 -- ACME only, everything else redirected.
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.accesslink.store;

    # Must stay reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# :443
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.accesslink.store;

    ssl_certificate     /etc/letsencrypt/live/api.accesslink.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.accesslink.store/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.accesslink.store/chain.pem;

    # 1.2 stays for the terminals; see the note at the top of this file.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Forward-secret suites only, ordered so an ESP32 lands on
    # ECDHE-RSA-AES128-GCM-SHA256 -- hardware-accelerated on that part and by
    # far the cheapest handshake it can do.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:AT_TLS:10m;
    ssl_session_timeout 1d;
    # Off: tickets without rotation undermine forward secrecy, and a fleet this
    # size gains nothing measurable from resumption across restarts.
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Two years, and only after the fleet has been on HTTPS long enough to be
    # sure. Terminals ignore HSTS entirely -- this is for the dashboard.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    # A terminal posting a batch of access logs is the largest body expected.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/access-terminal.access.log;
    error_log  /var/log/nginx/access-terminal.error.log warn;

    # ----------------------------------------------------------------------
    # Proxy defaults.
    #
    # X-Forwarded-For matters here beyond the usual logging reason: the API
    # records the caller's IP on the device row when the body omits one
    # (handlers/devices.go, c.ClientIP()). Without these the entire fleet is
    # recorded as 127.0.0.1.
    #
    # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter APPENDS to
    # whatever the client sent, which preserves a claim the client invented;
    # this overwrites it, so the header carries only what nginx observed.
    #
    # The application now calls SetTrustedProxies as well (TRUSTED_PROXIES,
    # router.go), so gin only believes this header when it arrives from the
    # proxy address. Both halves are needed: nginx stops a forged header
    # reaching the API, and TRUSTED_PROXIES stops one mattering if anything
    # ever reaches port 8080 without passing through here.
    # ----------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    limit_conn at_conn 20;

    # ----------------------------------------------------------------------
    # Registration: the provisioning endpoint, and the one worth guarding.
    # 6/min with a small burst -- a technician enrolling a rack of terminals by
    # hand never approaches it; a script does immediately.
    # ----------------------------------------------------------------------
    location = /api/v1/devices/register {
        limit_req zone=at_register burst=3 nodelay;
        proxy_pass http://access_terminal_api;
    }

    # Device traffic: heartbeat, jobs, acks, settings. Sized for a fleet
    # polling on the default 60 s interval with room for retries.
    location /api/v1/devices/ {
        limit_req zone=at_device burst=60 nodelay;
        proxy_pass http://access_terminal_api;
    }

    # Everything else on the API.
    location /api/ {
        limit_req zone=at_api burst=100 nodelay;
        proxy_pass http://access_terminal_api;
    }

    # Probes. Unauthenticated by design and safe to expose: /health/live and
    # /health/ready carry no tenant data.
    location /health {
        access_log off;
        proxy_pass http://access_terminal_api;
    }

    # Metrics carry device counts, site names and backlog sizes. METRICS_TOKEN
    # gates them in the application; this narrows it to the monitoring host as
    # well, so a leaked token is not enough on its own.
    location = /metrics {
        # Replace with the Prometheus host, or delete this block to scrape over
        # the private network only.
        allow 127.0.0.1;
        deny all;
        proxy_pass http://access_terminal_api;
    }

    location / {
        return 404;
    }
}
