version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: access-terminal-db
    environment:
      POSTGRES_USER: at_admin
      POSTGRES_PASSWORD: at_secure_password_change_me
      POSTGRES_DB: access_terminal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U at_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: access-terminal-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: at_admin
      DB_PASSWORD: at_secure_password_change_me
      DB_NAME: access_terminal
      SERVER_PORT: 8080
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
